<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Escape Button Options</title>
<style>
/* ===== Root Variables ===== */
:root {
  --primary: #6366f1;
  --primary-light: #818cf8;
  --primary-dark: #4f46e5;
  --accent: #ec4899;
  --accent-light: #f472b6;
  --bg-dark: #0f172a;
  --bg-card: #1e293b;
  --bg-input: #334155;
  --text-primary: #f1f5f9;
  --text-secondary: #cbd5e1;
  --border: #475569;
  --success: #10b981;
  --gradient: linear-gradient(135deg, #6366f1 0%, #ec4899 100%);
}

/* ===== Body & Background ===== */
body, html {
  margin: 0;
  padding: 0;
  height: 100%;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
  overflow: hidden;
  background: var(--bg-dark);
  color: var(--text-primary);
}

/* ===== Particle Canvas ===== */
#particles {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  opacity: 0.5;
}

/* ===== Scroll Container ===== */
.scroll-container {
  position: relative;
  z-index: 1;
  height: 100%;
  overflow-y: auto;
  padding: 40px 20px;
}

.scroll-container::-webkit-scrollbar {
  width: 8px;
}

.scroll-container::-webkit-scrollbar-track {
  background: transparent;
}

.scroll-container::-webkit-scrollbar-thumb {
  background: var(--primary);
  border-radius: 4px;
}

.scroll-container::-webkit-scrollbar-thumb:hover {
  background: var(--primary-light);
}

/* ===== Container ===== */
.container {
  max-width: 700px;
  margin: 0 auto;
  background: var(--bg-card);
  border-radius: 20px;
  padding: 40px;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 0 0 1px 1px rgba(99, 102, 241, 0.1);
  border: 1px solid rgba(99, 102, 241, 0.2);
  backdrop-filter: blur(10px);
}

/* ===== Header ===== */
.header {
  text-align: center;
  margin-bottom: 35px;
}

h1 {
  font-size: 32px;
  font-weight: 700;
  margin: 0 0 10px 0;
  background: var(--gradient);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: -0.5px;
}

.subtitle {
  color: var(--text-secondary);
  font-size: 14px;
  font-weight: 500;
  margin: 0;
}

/* ===== Section ===== */
.section {
  margin-bottom: 30px;
}

.section-title {
  font-size: 13px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--primary-light);
  margin: 0 0 12px 0;
  display: flex;
  align-items: center;
  gap: 8px;
}

.section-title::before {
  content: '';
  width: 4px;
  height: 4px;
  background: var(--accent);
  border-radius: 50%;
}

/* ===== Fields ===== */
.field {
  margin-bottom: 18px;
}

label {
  font-weight: 600;
  display: block;
  margin-bottom: 8px;
  font-size: 14px;
  color: var(--text-primary);
}

.field-hint {
  font-size: 12px;
  color: var(--text-secondary);
  margin-top: 4px;
}

input, textarea {
  width: 100%;
  padding: 12px 14px;
  border-radius: 12px;
  border: 1.5px solid var(--border);
  background: var(--bg-input);
  color: var(--text-primary);
  font-size: 14px;
  outline: none;
  box-sizing: border-box;
  transition: all 0.2s ease;
  font-family: inherit;
}

input::placeholder, textarea::placeholder {
  color: rgba(203, 213, 225, 0.5);
}

input:hover, textarea:hover {
  border-color: var(--primary);
  background: rgba(51, 65, 85, 0.8);
}

input:focus, textarea:focus {
  border-color: var(--primary);
  background: rgba(51, 65, 85, 0.9);
  box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
}

textarea {
  resize: vertical;
  min-height: 120px;
  font-family: 'Monaco', 'Courier New', monospace;
  font-size: 13px;
}

/* ===== Buttons ===== */
.buttons {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 12px;
  margin-top: 35px;
}

button {
  padding: 12px 20px;
  border-radius: 12px;
  border: none;
  cursor: pointer;
  font-weight: 600;
  font-size: 14px;
  transition: all 0.3s ease;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  position: relative;
  overflow: hidden;
  font-family: inherit;
}

button::before {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: rgba(255, 255, 255, 0.1);
  transition: left 0.3s ease;
  z-index: 0;
}

button:hover::before {
  left: 100%;
}

button span {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}

button.primary {
  background: var(--gradient);
  color: white;
  box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
}

button.primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 25px rgba(99, 102, 241, 0.6);
}

button.primary:active {
  transform: translateY(0);
}

button.secondary {
  background: linear-gradient(135deg, #ec4899 0%, #f472b6 100%);
  color: white;
  box-shadow: 0 4px 15px rgba(236, 72, 153, 0.4);
}

button.secondary:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 25px rgba(236, 72, 153, 0.6);
}

button.secondary:active {
  transform: translateY(0);
}

button.tertiary {
  background: rgba(99, 102, 241, 0.1);
  color: var(--primary-light);
  border: 1.5px solid var(--primary);
  box-shadow: none;
}

button.tertiary:hover {
  background: rgba(99, 102, 241, 0.2);
  transform: translateY(-2px);
}

button.tertiary:active {
  transform: translateY(0);
}

/* ===== Status Message ===== */
.status-message {
  padding: 12px 16px;
  border-radius: 12px;
  margin-top: 15px;
  font-size: 13px;
  font-weight: 600;
  display: none;
  align-items: center;
  gap: 8px;
  animation: slideIn 0.3s ease;
}

@keyframes slideIn {
  from {
    opacity: 0;
    transform: translateY(-10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.status-message.show {
  display: flex;
}

.status-message.success {
  background: rgba(16, 185, 129, 0.15);
  color: #6ee7b7;
  border: 1px solid rgba(16, 185, 129, 0.3);
}

.status-message::before {
  content: '✓';
  font-size: 16px;
}

/* ===== Footer ===== */
.footer {
  margin-top: 35px;
  padding-top: 20px;
  border-top: 1px solid var(--border);
  text-align: center;
  color: var(--text-secondary);
  font-size: 12px;
}

.shortcut-badge {
  display: inline-block;
  background: rgba(99, 102, 241, 0.2);
  border: 1px solid var(--primary);
  color: var(--primary-light);
  padding: 6px 12px;
  border-radius: 8px;
  font-weight: 600;
  margin-top: 10px;
  font-family: 'Monaco', 'Courier New', monospace;
  font-size: 12px;
}

/* ===== Responsive ===== */
@media (max-width: 600px) {
  .container {
    padding: 30px 20px;
    border-radius: 16px;
  }

  h1 {
    font-size: 26px;
  }

  .buttons {
    grid-template-columns: 1fr;
  }

  button {
    padding: 14px 16px;
  }
}
</style>
</head>
<body>
<canvas id="particles"></canvas>

<div class="scroll-container">
  <div class="container">
    <div class="header">
      <h1>⚡ Escape Button</h1>
      <p class="subtitle">Your emergency exit, configured</p>
    </div>

    <div class="section">
      <div class="section-title">Safe Destination</div>
      <div class="field">
        <label>Safe Site URL</label>
        <input id="safeSite" type="url" placeholder="https://example.com" />
        <div class="field-hint">Where you'll land when you press the button</div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">Protected Sites</div>
      <div class="field">
        <label>Whitelist</label>
        <textarea id="whitelist" placeholder="https://example.com&#10;another-site.com&#10;or use commas: site1.com, site2.com"></textarea>
        <div class="field-hint">These sites won't be erased from your history</div>
      </div>
    </div>

    <div class="buttons">
      <button id="save" class="primary"><span>💾 Save</span></button>
      <button id="restore" class="tertiary"><span>↻ Restore</span></button>
      <button id="github" class="secondary"><span>💖 Support</span></button>
    </div>

    <div class="status-message" id="statusMessage"></div>

    <div class="footer">
      <p style="margin: 0 0 10px 0;">Trigger with keyboard shortcut:</p>
      <div class="shortcut-badge" id="shortcutDisplay">Ctrl+Shift+Z</div>
    </div>
  </div>
</div>

<script src="options.js"></script>
</body>
</html>
